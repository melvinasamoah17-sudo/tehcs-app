name: tehcs_app
description: TEHCS - Twitch Empire Home Care Service App
publish_to: none
version: 1.1.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  http: ^1.3.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  local_auth: ^2.3.0
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/tehcs.jpg
    - assets/images/ad_1.jpg
    - assets/images/ad_2.jpg
    - assets/images/ad_3.jpg
    - assets/images/ad_4.jpg
    - assets/images/ad_5.jpg
    - assets/images/ad_6.jpg
    - assets/images/ad_7.jpg
    - assets/images/ad_8.jpg

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/images/tehcs.jpg
  min_sdk_android: 21