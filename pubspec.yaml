name: tehcs_app
description: TEHCS — Twitch Empire Home Care Service App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  # Utils
  http: ^1.3.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  path_provider_foundation: 2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/tehcs.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/tehcs.jpg"
  min_sdk_android: 21
